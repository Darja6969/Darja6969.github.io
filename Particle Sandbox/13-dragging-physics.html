<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>13 Dragging Physics</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: linear-gradient(135deg, #dbeafe, #bfdbfe, #93c5fd);
      font-family: Arial, sans-serif;
    }
    .node {
      position: absolute;
      width: 90px;
      height: 90px;
      border-radius: 24px;
      background: #1d4ed8;
      color: #eff6ff;
      display: grid;
      place-items: center;
      font-weight: 700;
      box-shadow: 0 8px 20px #1e3a8a40;
      user-select: none;
      touch-action: none;
      cursor: grab;
    }
  </style>
</head>
<body>
  <script>
    const nodes = [];
    for (let i = 0; i < 6; i += 1) {
      const el = document.createElement("div");
      el.className = "node";
      el.textContent = `N${i + 1}`;
      const x = 80 + i * 110;
      const y = 100 + (i % 2) * 120;
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      document.body.appendChild(el);
      nodes.push({
        el,
        x,
        y,
        tx: x,
        ty: y,
        dragging: false,
        ox: 0,
        oy: 0,
      });
    }

    nodes.forEach((n) => {
      n.el.addEventListener("pointerdown", (e) => {
        n.dragging = true;
        n.el.setPointerCapture(e.pointerId);
        n.ox = e.clientX - n.tx;
        n.oy = e.clientY - n.ty;
        n.el.style.cursor = "grabbing";
      });
      n.el.addEventListener("pointermove", (e) => {
        if (!n.dragging) return;
        n.tx = e.clientX - n.ox;
        n.ty = e.clientY - n.oy;
      });
      n.el.addEventListener("pointerup", () => {
        n.dragging = false;
        n.el.style.cursor = "grab";
      });
    });

    function animate() {
      // Spring interpolation gives a heavier, inertial drag feel.
      nodes.forEach((n) => {
        n.x += (n.tx - n.x) * 0.16;
        n.y += (n.ty - n.y) * 0.16;
        n.el.style.left = `${n.x}px`;
        n.el.style.top = `${n.y}px`;
      });
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
