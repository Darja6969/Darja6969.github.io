<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>09 Custom Cursor Shape</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      cursor: none;
      background: #082f49;
      color: #e0f2fe;
      font-family: "Century Gothic", "Segoe UI", sans-serif;
      display: grid;
      place-items: center;
      text-align: center;
    }
    .cursor {
      position: fixed;
      width: 28px;
      height: 28px;
      pointer-events: none;
      border: 3px solid #22d3ee;
      border-radius: 5px;
      transform-origin: center;
      z-index: 9999;
    }
    .cursor::after {
      content: "";
      position: absolute;
      inset: 7px;
      border-radius: 2px;
      background: #22d3ee66;
    }
  </style>
</head>
<body>
  <main>
    <h1>Custom Rotating Cursor</h1>
    <p>Move mouse to rotate the pointer shape based on direction.</p>
  </main>
  <div class="cursor" id="cursor"></div>

  <script>
    const cursor = document.getElementById("cursor");
    let lastX = innerWidth / 2;
    let lastY = innerHeight / 2;

    addEventListener("mousemove", (e) => {
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      const angle = Math.atan2(dy, dx) * (180 / Math.PI);
      cursor.style.left = `${e.clientX - 14}px`;
      cursor.style.top = `${e.clientY - 14}px`;
      cursor.style.transform = `rotate(${angle + 45}deg)`;
      lastX = e.clientX;
      lastY = e.clientY;
    });
  </script>
</body>
</html>
