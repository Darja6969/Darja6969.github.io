<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>12 Color Splash</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #020617;
      overflow: hidden;
      cursor: pointer;
      font-family: "Segoe UI", sans-serif;
    }
    .splash {
      position: absolute;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      mix-blend-mode: screen;
      opacity: 0.75;
    }
  </style>
</head>
<body>
  <script>
    let active = null;
    let growth = 0;
    let center = { x: 0, y: 0 };

    function makeSplash(x, y) {
      const el = document.createElement("div");
      el.className = "splash";
      const hue = Math.random() * 360;
      el.style.background = `radial-gradient(circle, hsl(${hue} 100% 70%), transparent 70%)`;
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      el.style.width = "0px";
      el.style.height = "0px";
      document.body.appendChild(el);
      return el;
    }

    addEventListener("mousedown", (e) => {
      center = { x: e.clientX, y: e.clientY };
      growth = 10;
      active = makeSplash(center.x, center.y);
    });

    addEventListener("mouseup", () => {
      if (!active) return;
      active.style.transition = "opacity 400ms";
      active.style.opacity = "0";
      const done = active;
      setTimeout(() => done.remove(), 450);
      active = null;
    });

    function loop() {
      if (active) {
        growth = Math.min(growth + 14, 520);
        active.style.width = `${growth}px`;
        active.style.height = `${growth}px`;
      }
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
