<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>05 Scroll Driven Scaling</title>
  <style>
    :root {
      --base: #f4f4f5;
      --ink: #18181b;
      --accent: #ea580c;
    }
    body {
      margin: 0;
      min-height: 320vh;
      background: linear-gradient(#fff7ed, #e4e4e7 45%, #f0fdfa);
      font-family: Cambria, Cochin, Georgia, serif;
      color: var(--ink);
    }
    .sticky {
      position: sticky;
      top: 0;
      height: 100vh;
      display: grid;
      place-items: center;
    }
    .scene {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 16px;
    }
    .box {
      width: 140px;
      height: 140px;
      border-radius: 24px;
      display: grid;
      place-items: center;
      background: #18181b;
      color: #fff;
      font-weight: 700;
      transition: transform 90ms linear;
      box-shadow: 0 14px 30px #00000030;
    }
    .box:nth-child(2n) { background: #ea580c; }
  </style>
</head>
<body>
  <section class="sticky">
    <div class="scene">
      <div class="box">A</div>
      <div class="box">B</div>
      <div class="box">C</div>
      <div class="box">D</div>
    </div>
  </section>

  <script>
    const boxes = [...document.querySelectorAll(".box")];

    function update() {
      const max = document.documentElement.scrollHeight - innerHeight;
      const progress = max > 0 ? scrollY / max : 0;
      boxes.forEach((b, i) => {
        const dir = i % 2 ? -1 : 1;
        const scale = 0.6 + progress * (1.4 + i * 0.12);
        const y = dir * progress * 60;
        b.style.transform = `translateY(${y}px) scale(${scale})`;
      });
    }

    addEventListener("scroll", update, { passive: true });
    update();
  </script>
</body>
</html>
