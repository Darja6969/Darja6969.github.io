<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>15 Hover Filter Swap</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #111827;
      color: #f9fafb;
      font-family: "Segoe UI", sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .grid {
      width: min(1100px, 94vw);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }
    img {
      width: 100%;
      height: 230px;
      object-fit: cover;
      border-radius: 14px;
      filter: grayscale(1) contrast(1.1);
      transition: filter 260ms ease, transform 260ms ease;
    }
    img:hover {
      filter: invert(0.1) saturate(2) hue-rotate(135deg) contrast(1.4);
      transform: scale(1.04) rotate(-1deg);
    }
  </style>
</head>
<body>
  <div class="grid">
    <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=900&q=80" alt="img1" />
    <img src="https://images.unsplash.com/photo-1511300636408-a63a89df3482?auto=format&fit=crop&w=900&q=80" alt="img2" />
    <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=900&q=80" alt="img3" />
    <img src="https://images.unsplash.com/photo-1516280440614-37939bbacd81?auto=format&fit=crop&w=900&q=80" alt="img4" />
  </div>
</body>
</html>
