<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>02 Magnetic Buttons</title>
  <style>
    :root {
      --bg1: #fefce8;
      --bg2: #e0f2fe;
      --ink: #111827;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
    }
    .wrap {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 18px;
      padding: 20px;
      max-width: 760px;
    }
    button {
      border: none;
      padding: 16px 24px;
      border-radius: 14px;
      font-size: 18px;
      cursor: pointer;
      background: #111827;
      color: #f9fafb;
      transition: transform 120ms ease-out, box-shadow 180ms;
      box-shadow: 0 12px 18px #1118272a;
      will-change: transform;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <button>Play</button>
    <button>Explore</button>
    <button>Render</button>
    <button>Launch</button>
    <button>Create</button>
  </div>

  <script>
    const buttons = [...document.querySelectorAll("button")];
    const radius = 130;
    const pull = 22;

    window.addEventListener("mousemove", (e) => {
      buttons.forEach((btn) => {
        const rect = btn.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const dx = e.clientX - cx;
        const dy = e.clientY - cy;
        const dist = Math.hypot(dx, dy);

        if (dist < radius) {
          const strength = (1 - dist / radius) * pull;
          const angle = Math.atan2(dy, dx);
          const tx = Math.cos(angle) * strength;
          const ty = Math.sin(angle) * strength;
          btn.style.transform = `translate(${tx}px, ${ty}px)`;
          btn.style.boxShadow = "0 18px 30px #11182744";
        } else {
          btn.style.transform = "translate(0, 0)";
          btn.style.boxShadow = "0 12px 18px #1118272a";
        }
      });
    });
  </script>
</body>
</html>
