<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>16 Text Shadow Follow</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(120deg, #fff7ed, #ffedd5);
      display: grid;
      place-items: center;
      font-family: "Impact", "Arial Black", sans-serif;
      text-align: center;
      color: #9a3412;
      padding: 20px;
    }
    h1, h2 {
      margin: 0.2em 0;
      letter-spacing: 0.03em;
      transition: text-shadow 80ms linear;
    }
    h1 { font-size: clamp(2.2rem, 6vw, 5rem); }
    h2 { font-size: clamp(1.2rem, 3.5vw, 2.4rem); }
  </style>
</head>
<body>
  <main>
    <h1 class="sun">Where Mouse, There Sun</h1>
    <h2 class="sun">Shadows always point away from cursor</h2>
    <h2 class="sun">Move pointer around this page</h2>
  </main>

  <script>
    const heads = [...document.querySelectorAll(".sun")];
    addEventListener("mousemove", (e) => {
      const cx = innerWidth / 2;
      const cy = innerHeight / 2;
      const dx = (e.clientX - cx) / 40;
      const dy = (e.clientY - cy) / 40;
      heads.forEach((h, i) => {
        const m = 1 + i * 0.6;
        h.style.textShadow = `${-dx * m}px ${-dy * m}px 0 #7c2d12aa`;
      });
    });
  </script>
</body>
</html>
