<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>11 Sticker Slap</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: repeating-linear-gradient(
        45deg,
        #fef3c7,
        #fef3c7 20px,
        #fde68a 20px,
        #fde68a 40px
      );
      font-family: "Comic Sans MS", "Trebuchet MS", sans-serif;
      overflow: hidden;
      cursor: crosshair;
    }
    .tip {
      position: fixed;
      top: 10px;
      left: 10px;
      background: #7c2d12;
      color: #fffbeb;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 14px;
    }
    .sticker {
      position: absolute;
      font-size: 44px;
      pointer-events: none;
      filter: drop-shadow(0 6px 8px #00000033);
      transform-origin: center;
    }
  </style>
</head>
<body>
  <div class="tip">Click to slap random stickers</div>

  <script>
    const stickers = ["⭐", "🔥", "💥", "🎯", "🌀", "🌈", "⚡", "🎉", "🍀"];

    addEventListener("click", (e) => {
      const s = document.createElement("div");
      s.className = "sticker";
      s.textContent = stickers[Math.floor(Math.random() * stickers.length)];
      s.style.left = `${e.clientX - 20}px`;
      s.style.top = `${e.clientY - 20}px`;
      s.style.transform = `rotate(${(Math.random() - 0.5) * 70}deg) scale(${0.9 + Math.random() * 0.6})`;
      document.body.appendChild(s);
    });
  </script>
</body>
</html>
