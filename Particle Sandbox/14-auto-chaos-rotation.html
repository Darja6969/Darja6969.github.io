<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>14 Auto Chaos Rotation</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 20% 20%, #fef2f2, #fecaca 45%, #fca5a5);
      font-family: Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    .stage {
      width: min(92vw, 940px);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 16px;
      padding: 18px;
    }
    .tile {
      height: 120px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      color: #7f1d1d;
      font-weight: 700;
      background: #ffedd5;
      border: 1px solid #fca5a5;
      transform-origin: center;
    }
  </style>
</head>
<body>
  <div class="stage" id="stage"></div>

  <script>
    const stage = document.getElementById("stage");
    const items = [];
    for (let i = 0; i < 18; i += 1) {
      const d = document.createElement("div");
      d.className = "tile";
      d.textContent = `E${i + 1}`;
      stage.appendChild(d);
      items.push({ el: d, rot: Math.random() * 360, speed: (Math.random() - 0.5) * 0.8 });
    }

    function render() {
      items.forEach((it) => {
        it.rot += it.speed;
        it.el.style.transform = `rotate(${it.rot}deg)`;
      });
      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
