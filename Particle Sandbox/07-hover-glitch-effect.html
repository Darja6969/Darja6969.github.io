<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>07 Hover Glitch Effect</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #09090b;
      font-family: "Courier New", Courier, monospace;
      color: #e4e4e7;
    }
    .wrap {
      width: min(86vw, 680px);
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      border: 2px solid #3f3f46;
    }
    .wrap img {
      width: 100%;
      display: block;
      filter: grayscale(1) contrast(1.15);
      transition: transform 250ms, filter 250ms;
    }
    .wrap::before,
    .wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      background: inherit;
      mix-blend-mode: screen;
      opacity: 0;
      pointer-events: none;
    }
    .wrap::before { background: #ff006e55; }
    .wrap::after { background: #00d9ff55; }

    .wrap:hover img {
      filter: saturate(1.6) contrast(1.3) hue-rotate(24deg);
      animation: jitter 180ms steps(2) infinite;
    }
    .wrap:hover::before,
    .wrap:hover::after {
      opacity: 1;
      animation: slice 180ms steps(2) infinite;
    }
    .wrap:hover::after { animation-direction: reverse; }

    @keyframes jitter {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-2px, 1px); }
      50% { transform: translate(2px, -1px); }
      75% { transform: translate(-1px, -2px); }
      100% { transform: translate(0, 0); }
    }
    @keyframes slice {
      0% { clip-path: inset(0 0 80% 0); transform: translateX(-2px); }
      40% { clip-path: inset(30% 0 40% 0); transform: translateX(3px); }
      80% { clip-path: inset(70% 0 5% 0); transform: translateX(-3px); }
      100% { clip-path: inset(0 0 0 0); transform: translateX(0); }
    }
  </style>
</head>
<body>
  <figure class="wrap">
    <img src="https://images.unsplash.com/photo-1518779578993-ec3579fee39f?auto=format&fit=crop&w=1400&q=80" alt="Glitch target" />
  </figure>
</body>
</html>
