<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>06 Toggle Themes With Sound</title>
  <style>
    :root {
      --bg: #f8fafc;
      --fg: #0f172a;
      --surface: #ffffff;
    }
    body.dark {
      --bg: #0b1220;
      --fg: #f8fafc;
      --surface: #111827;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--fg);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      transition: background 250ms ease, color 250ms ease;
    }
    .panel {
      background: var(--surface);
      border: 1px solid #94a3b833;
      border-radius: 16px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 10px 24px #0000001f;
    }
    button {
      font-size: 16px;
      border: none;
      border-radius: 999px;
      padding: 12px 20px;
      background: #0ea5e9;
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h2>Theme Toggle + Sound</h2>
    <button id="toggle">Switch Theme</button>
  </div>

  <script>
    const button = document.getElementById("toggle");
    let audioCtx;

    function clickSound() {
      audioCtx = audioCtx || new AudioContext();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(500, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(260, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.2, audioCtx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.13);
    }

    button.addEventListener("click", () => {
      document.body.classList.toggle("dark");
      clickSound();
    });
  </script>
</body>
</html>
