<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>01 Cursor Trail</title>
  <style>
    :root {
      --bg: #0f172a;
      --fg: #e2e8f0;
      --accent: #22d3ee;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      background: radial-gradient(circle at 20% 20%, #1e293b 0%, var(--bg) 60%);
      color: var(--fg);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }
    canvas { display: block; width: 100%; height: 100%; }
    .label {
      position: fixed;
      top: 14px;
      left: 14px;
      padding: 10px 14px;
      border-radius: 999px;
      background: #0f172acc;
      border: 1px solid #22d3ee66;
      letter-spacing: 0.04em;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="label">Move your mouse to paint sparks</div>
  <canvas id="trail"></canvas>

  <script>
    const canvas = document.getElementById("trail");
    const ctx = canvas.getContext("2d");
    const sparks = [];
    let pointer = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener("resize", resize);

    window.addEventListener("mousemove", (e) => {
      pointer.x = e.clientX;
      pointer.y = e.clientY;
      for (let i = 0; i < 4; i += 1) {
        sparks.push({
          x: pointer.x,
          y: pointer.y,
          vx: (Math.random() - 0.5) * 2,
          vy: (Math.random() - 0.5) * 2,
          life: 1,
          size: 2 + Math.random() * 8,
          hue: 170 + Math.random() * 40,
          shape: Math.random() > 0.5 ? "circle" : "square",
        });
      }
    });

    function drawSpark(s) {
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.globalAlpha = s.life;
      ctx.fillStyle = `hsl(${s.hue} 100% 65%)`;
      if (s.shape === "circle") {
        ctx.beginPath();
        ctx.arc(0, 0, s.size * 0.5, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.rotate(s.life * 5);
        ctx.fillRect(-s.size * 0.4, -s.size * 0.4, s.size * 0.8, s.size * 0.8);
      }
      ctx.restore();
    }

    function tick() {
      ctx.fillStyle = "rgba(15, 23, 42, 0.18)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let i = sparks.length - 1; i >= 0; i -= 1) {
        const s = sparks[i];
        s.x += s.vx;
        s.y += s.vy;
        s.vy += 0.02;
        s.life -= 0.02;
        drawSpark(s);
        if (s.life <= 0) sparks.splice(i, 1);
      }

      requestAnimationFrame(tick);
    }
    tick();
  </script>
</body>
</html>
