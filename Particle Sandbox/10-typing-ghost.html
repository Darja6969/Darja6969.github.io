<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>10 Typing Ghost</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(125deg, #312e81, #1f2937);
      color: #f9fafb;
      font-family: "Palatino Linotype", Palatino, serif;
      padding: 24px;
    }
    .app {
      width: min(760px, 94vw);
      background: #111827bf;
      border-radius: 18px;
      padding: 18px;
      border: 1px solid #a5b4fc4d;
    }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-size: 18px;
      margin-bottom: 18px;
    }
    .output {
      min-height: 120px;
      font-size: 30px;
      line-height: 1.5;
      word-break: break-word;
    }
    .char {
      opacity: 0;
      display: inline-block;
      transform: translateY(14px);
      animation: rise 360ms ease forwards;
    }
    @keyframes rise {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <section class="app">
    <input id="source" placeholder="Type here... ghost letters will arrive late" />
    <div class="output" id="ghost"></div>
  </section>

  <script>
    const source = document.getElementById("source");
    const ghost = document.getElementById("ghost");

    source.addEventListener("input", () => {
      const text = source.value;
      ghost.textContent = "";
      [...text].forEach((ch, i) => {
        setTimeout(() => {
          const s = document.createElement("span");
          s.className = "char";
          s.textContent = ch;
          ghost.appendChild(s);
        }, 80 * i + 120);
      });
    });
  </script>
</body>
</html>
