<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>04 Click To Explode</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      background: #111827;
      color: #f9fafb;
      font-family: Verdana, Geneva, sans-serif;
    }
    #field { width: 100%; height: 100%; display: block; }
    .hint {
      position: fixed;
      right: 12px;
      bottom: 12px;
      font-size: 14px;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <canvas id="field"></canvas>
  <div class="hint">Click anywhere to explode circles</div>

  <script>
    const c = document.getElementById("field");
    const x = c.getContext("2d");
    const particles = [];

    function fit() {
      c.width = innerWidth;
      c.height = innerHeight;
    }
    fit();
    addEventListener("resize", fit);

    addEventListener("click", (e) => {
      for (let i = 0; i < 28; i += 1) {
        const angle = (Math.PI * 2 * i) / 28 + Math.random() * 0.4;
        const speed = 1 + Math.random() * 5;
        particles.push({
          x: e.clientX,
          y: e.clientY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1,
          r: 2 + Math.random() * 6,
          hue: Math.random() * 360,
        });
      }
    });

    function frame() {
      x.fillStyle = "rgba(17,24,39,0.25)";
      x.fillRect(0, 0, c.width, c.height);

      for (let i = particles.length - 1; i >= 0; i -= 1) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.99;
        p.vy *= 0.99;
        p.life -= 0.015;

        x.globalAlpha = Math.max(0, p.life);
        x.fillStyle = `hsl(${p.hue} 95% 62%)`;
        x.beginPath();
        x.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        x.fill();

        if (p.life <= 0) particles.splice(i, 1);
      }
      x.globalAlpha = 1;
      requestAnimationFrame(frame);
    }
    frame();
  </script>
</body>
</html>
