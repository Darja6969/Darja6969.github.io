<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>19 Key Sound Piano</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(130deg, #cffafe, #a5f3fc, #67e8f9);
      font-family: "Segoe UI", sans-serif;
      color: #164e63;
      text-align: center;
      padding: 20px;
    }
    .pad {
      width: min(560px, 92vw);
      border-radius: 18px;
      padding: 20px;
      background: #ecfeffcc;
      border: 1px solid #155e7533;
      box-shadow: 0 12px 20px #155e7522;
    }
    #last {
      font-size: 44px;
      margin: 14px 0;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="pad">
    <h2>Keyboard Sound Piano</h2>
    <p>Press any key to trigger random short tones.</p>
    <div id="last">-</div>
    <input id="typing" placeholder="Type here" style="width:100%;padding:10px;border-radius:10px;border:1px solid #0891b2;" />
  </div>

  <script>
    let ctx;
    const last = document.getElementById("last");

    function blip() {
      ctx = ctx || new AudioContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const wave = ["sine", "triangle", "square", "sawtooth"]; 
      osc.type = wave[Math.floor(Math.random() * wave.length)];
      const freq = 200 + Math.random() * 900;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      gain.gain.setValueAtTime(0.001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
      osc.connect(gain).connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.13);
    }

    addEventListener("keydown", (e) => {
      blip();
      last.textContent = e.key.length === 1 ? e.key : `[${e.key}]`;
    });
  </script>
</body>
</html>
