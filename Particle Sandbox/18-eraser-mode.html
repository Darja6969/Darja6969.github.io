<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>18 Eraser Mode</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: url("https://images.unsplash.com/photo-1473773508845-188df298d2d1?auto=format&fit=crop&w=1500&q=80") center/cover fixed;
      font-family: Arial, sans-serif;
    }
    .toolbar {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 10;
      background: #111827cc;
      color: #fff;
      border-radius: 999px;
      padding: 8px 12px;
    }
    .grid {
      width: min(980px, 92vw);
      margin: 90px auto;
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    }
    .tile {
      height: 100px;
      border-radius: 12px;
      background: #0f172ad9;
      border: 1px solid #ffffff2e;
      transition: opacity 220ms ease;
    }
    .erase .tile:hover {
      opacity: 0.05;
    }
  </style>
</head>
<body>
  <label class="toolbar">
    <input id="toggle" type="checkbox" /> Eraser mode
  </label>
  <div class="grid" id="grid"></div>

  <script>
    const grid = document.getElementById("grid");
    for (let i = 0; i < 40; i += 1) {
      const t = document.createElement("div");
      t.className = "tile";
      grid.appendChild(t);
    }

    document.getElementById("toggle").addEventListener("change", (e) => {
      document.body.classList.toggle("erase", e.target.checked);
    });
  </script>
</body>
</html>
