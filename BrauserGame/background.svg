<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Деревянный пол -->
  <rect width="800" height="600" fill="#5d4037"/>
  <pattern id="wood" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <rect width="40" height="40" fill="#6d4c41"/>
    <line x1="0" y1="0" x2="40" y2="0" stroke="#4e342e" stroke-width="1"/>
    <line x1="0" y1="20" x2="40" y2="20" stroke="#4e342e" stroke-width="0.5"/>
  </pattern>
  <rect width="800" height="600" fill="url(#wood)"/>
  
  <!-- Декоративные элементы комнаты -->
  <!-- Ковёр -->
  <circle cx="400" cy="300" r="80" fill="#c084fc" opacity="0.3"/>
  
  <!-- Стены (границы) -->
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#3e2723" stroke-width="4"/>
  
  <!-- Окна -->
  <rect x="100" y="20" width="80" height="30" fill="#81d4fa" opacity="0.4"/>
  <rect x="600" y="20" width="100" height="30" fill="#81d4fa" opacity="0.4"/>
  
  <!-- Случайные элементы мебели (очень светлые) -->
  <rect x="150" y="150" width="50" height="50" fill="#8d6e63" opacity="0.2"/>
  <rect x="600" y="200" width="60" height="40" fill="#8d6e63" opacity="0.2"/>
  <rect x="300" y="450" width="70" height="30" fill="#8d6e63" opacity="0.2"/>
</svg>