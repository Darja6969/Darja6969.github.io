<!doctype html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>07 Hover-Glitch Effect</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #10131c;
      font-family: "Segoe UI", sans-serif;
      color: #fff;
    }
    .frame {
      position: relative;
      width: min(80vw, 520px);
      aspect-ratio: 16 / 10;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 16px 28px #00000066;
    }
    .layer {
      position: absolute;
      inset: 0;
      background: linear-gradient(140deg, #00bcd4, #ffc857 48%, #ff5a5f);
      transition: transform 120ms linear, filter 120ms linear;
    }
    .noise {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent 0 3px,
        #ffffff10 3px 5px
      );
      opacity: 0;
    }
    .frame:hover .noise {
      opacity: 1;
      animation: shake 240ms infinite steps(2);
    }
    .frame:hover .layer {
      filter: hue-rotate(55deg) contrast(1.35);
      animation: glitch 220ms infinite steps(2);
    }
    @keyframes glitch {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-5px, 2px); }
      50% { transform: translate(3px, -3px); }
      75% { transform: translate(-2px, -1px); }
      100% { transform: translate(0, 0); }
    }
    @keyframes shake {
      0% { transform: translateX(0); }
      50% { transform: translateX(4px); }
      100% { transform: translateX(-3px); }
    }
  </style>
  <link rel="stylesheet" href="nav.css">
</head>
<body>
  <div class="frame">
    <div class="layer"></div>
    <div class="noise"></div>
  </div>
  <script src="nav.js"></script>
</body>
</html>
