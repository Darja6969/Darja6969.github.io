<!doctype html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>04 Click-to-Explode</title>
  <style>
    body {
      margin: 0;
      background: #141414;
      height: 100vh;
      overflow: hidden;
      font-family: "Segoe UI", sans-serif;
      color: #f2f2f2;
    }
    .hint { position: fixed; left: 12px; top: 10px; opacity: 0.8; }
    .piece {
      position: fixed;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      pointer-events: none;
      animation: fly 900ms cubic-bezier(0.2, 0.9, 0.2, 1) forwards;
    }
    @keyframes fly {
      to {
        transform: translate(var(--dx), var(--dy)) scale(0.1);
        opacity: 0;
      }
    }
  </style>
  <link rel="stylesheet" href="nav.css">
</head>
<body>
  <div class="hint">Klopsa suvalises kohas.</div>
  <script>
    const palette = ['#ff4d6d', '#ffd166', '#7bdff2', '#b8f2e6', '#cdb4db'];
    window.addEventListener('click', (event) => {
      for (let i = 0; i < 26; i += 1) {
        const p = document.createElement('div');
        p.className = 'piece';
        const angle = (Math.PI * 2 * i) / 26 + Math.random() * 0.35;
        const distance = 50 + Math.random() * 140;
        p.style.left = `${event.clientX - 6}px`;
        p.style.top = `${event.clientY - 6}px`;
        p.style.background = palette[(Math.random() * palette.length) | 0];
        p.style.setProperty('--dx', `${Math.cos(angle) * distance}px`);
        p.style.setProperty('--dy', `${Math.sin(angle) * distance}px`);
        document.body.appendChild(p);
        p.addEventListener('animationend', () => p.remove());
      }
    });
  </script>
  <script src="nav.js"></script>
</body>
</html>
