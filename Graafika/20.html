<!doctype html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>20 Screen Edge Warp</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: linear-gradient(45deg, #d9ed92, #99d98c, #52b69a);
      font-family: "Verdana", sans-serif;
    }
    .ball {
      position: absolute;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #184e77;
      color: #fff;
      display: grid;
      place-items: center;
      user-select: none;
      cursor: grab;
      box-shadow: 0 10px 18px #0000002a;
      touch-action: none;
    }
    .hint { position: fixed; left: 10px; top: 8px; }
  </style>
  <link rel="stylesheet" href="nav.css">
</head>
<body>
  <div class="hint">Lohista palli ule serva: ilmub vastaskuljel.</div>
  <div class="ball" id="ball" style="left: 120px; top: 140px;">WARP</div>
  <script>
    const ball = document.getElementById('ball');
    let dragging = false;
    let pointerId = null;
    let ox = 0;
    let oy = 0;
    let x = 120;
    let y = 140;
    const size = 90;
    const half = size / 2;

    function render() {
      const cx = x + half;
      const cy = y + half;
      if (cx < 0) x = innerWidth - half;
      if (cx > innerWidth) x = -half;
      if (cy < 0) y = innerHeight - half;
      if (cy > innerHeight) y = -half;
      ball.style.left = `${x}px`;
      ball.style.top = `${y}px`;
    }

    ball.addEventListener('pointerdown', (event) => {
      dragging = true;
      pointerId = event.pointerId;
      ox = event.clientX - x;
      oy = event.clientY - y;
      ball.style.cursor = 'grabbing';
      ball.setPointerCapture(pointerId);
    });

    addEventListener('pointermove', (event) => {
      if (!dragging || event.pointerId !== pointerId) return;
      x = event.clientX - ox;
      y = event.clientY - oy;
      render();
    });

    function stopDrag(event) {
      if (!dragging || event.pointerId !== pointerId) return;
      dragging = false;
      pointerId = null;
      ball.style.cursor = 'grab';
    }

    addEventListener('pointerup', stopDrag);
    addEventListener('pointercancel', stopDrag);
    addEventListener('resize', render);
    render();
  </script>
  <script src="nav.js"></script>
</body>
</html>
