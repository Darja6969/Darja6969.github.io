<!doctype html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>16 Text Shadow Follow</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #fff1d0, #c9f0ff);
      display: grid;
      place-items: center;
      font-family: "Franklin Gothic Medium", sans-serif;
      overflow: hidden;
    }
    .stack {
      text-align: center;
      color: #0b132b;
    }
    h1, h2, h3 {
      margin: 12px 0;
      letter-spacing: 0.04em;
      transition: text-shadow 80ms linear;
    }
    h1 { font-size: clamp(44px, 8vw, 80px); }
    h2 { font-size: clamp(34px, 6vw, 58px); }
    h3 { font-size: clamp(24px, 4vw, 40px); }
  </style>
  <link rel="stylesheet" href="nav.css">
</head>
<body>
  <div class="stack">
    <h1 class="sun">SUN</h1>
    <h2 class="sun">SHADOW</h2>
    <h3 class="sun">FOLLOW</h3>
  </div>
  <script>
    const titles = [...document.querySelectorAll('.sun')];
    addEventListener('pointermove', (event) => {
      const cx = innerWidth / 2;
      const cy = innerHeight / 2;
      const dx = (cx - event.clientX) / 25;
      const dy = (cy - event.clientY) / 25;
      titles.forEach((el, i) => {
        const mul = i + 1;
        el.style.textShadow = `${dx * mul}px ${dy * mul}px 0 #ff7b00`;
      });
    });
  </script>
  <script src="nav.js"></script>
</body>
</html>
