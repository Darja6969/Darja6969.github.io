<!doctype html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10 Typing Ghost</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f172a;
      color: #dbeafe;
      font-family: "Courier New", monospace;
      padding: 20px;
    }
    .box {
      width: min(90vw, 700px);
      background: #1e293b;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 14px 24px #0000003a;
    }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0b1220;
      color: #dbeafe;
      font-size: 18px;
    }
    .output {
      margin-top: 16px;
      min-height: 90px;
      font-size: 26px;
      display: flex;
      flex-wrap: wrap;
      gap: 2px;
    }
    .char {
      opacity: 0;
      transform: translateY(16px);
      animation: rise 360ms ease forwards;
    }
    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
  <link rel="stylesheet" href="nav.css">
</head>
<body>
  <div class="box">
    <input id="in" placeholder="Kirjuta midagi...">
    <div id="out" class="output"></div>
  </div>
  <script>
    const input = document.getElementById('in');
    const out = document.getElementById('out');
    let tick = 0;
    input.addEventListener('input', () => {
      const id = ++tick;
      out.textContent = '';
      [...input.value].forEach((ch, i) => {
        setTimeout(() => {
          if (id !== tick) return;
          const span = document.createElement('span');
          span.className = 'char';
          span.textContent = ch;
          out.appendChild(span);
        }, i * 70);
      });
    });
  </script>
  <script src="nav.js"></script>
</body>
</html>
